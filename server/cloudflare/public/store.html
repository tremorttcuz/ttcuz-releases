<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5fa3">
<title>Плагины ttcuz</title>
<meta name="description" content="Магазин плагинов мода ttcuz: проверенные дополнения, плагины на проверке, отзывы и установка в один тап.">
<link rel="stylesheet" href="ui.css">
<style>
.app{padding-bottom:120px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.f{fill:currentColor;stroke:none}
.me{width:36px;height:36px;border-radius:50%;border:0;padding:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:inherit;font-weight:700;cursor:pointer;overflow:hidden;flex:none;transition:transform .35s var(--spring)}
.me:active{transform:scale(.9)}
.me img{width:100%;height:100%;object-fit:cover}
.me .ico{width:20px;height:20px}
.perm i{color:var(--primary)}.perm.warn i{color:var(--err)}
.perm i .ico{width:20px;height:20px}
.mini{display:inline-flex;gap:4px;color:var(--var)}.mini .ico{width:14px;height:14px}
.rate .ico{width:13px;height:13px;color:#e8a100}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}.stars .ico{width:14px;height:14px}
.stars .on{color:#e8a100}.stars .off{color:var(--outline);opacity:.5}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;vertical-align:2px;background:color-mix(in srgb,#e8a100 18%,transparent);color:#b07800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#f5c04a}}
.badge .ico{width:12px;height:12px}
.badge.ok{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.badge.bad{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.pend{margin:4px 0 12px;padding:14px 16px;border-radius:20px;background:color-mix(in srgb,#e8a100 12%,var(--sc));display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--var)}
.pend .ico{color:#e8a100;width:22px;height:22px}
.pend b{color:var(--on)}
.crop{position:fixed;inset:0;z-index:60;background:#0009;display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .2s}.crop.open{opacity:1}
.crop .cp{background:var(--sc,#1d1b20);color:var(--on,#e6e1e5);border-radius:28px;padding:22px;width:min(760px,100%);transform:scale(.94);transition:transform .25s cubic-bezier(.2,0,0,1)}.crop.open .cp{transform:none}
.crop h3{margin:0 0 6px}.crop p{margin:0 0 14px;opacity:.75;font-size:14px}
.crop .cf{position:relative;width:100%;aspect-ratio:3/1;border-radius:18px;overflow:hidden;background:#000;touch-action:none;cursor:grab}.crop .cf:active{cursor:grabbing}
.crop .cf i{position:absolute;inset:0;border:2px solid #fff9;border-radius:18px;pointer-events:none;box-shadow:inset 0 0 0 1px #0006}
.crop .cz{display:flex;gap:10px;align-items:center;margin:14px 0 4px}.crop .cz input{flex:1}
.bnr{margin:8px 0 0;height:min(34vw,220px);background:var(--sc) center/cover no-repeat;border-radius:28px;position:relative}
.bnr+.dh{margin-top:-44px;position:relative;align-items:flex-start}
.bnr+.dh>div:last-child{margin-top:50px}
.bnr+.dh .icw{box-shadow:0 0 0 4px var(--bg);border-radius:24%}
.bcard{display:block;margin:12px 0;border-radius:24px;overflow:hidden;background:var(--sc);cursor:pointer;animation:rvin .45s var(--emph) both;animation-delay:calc(var(--i,0)*40ms);transition:transform .45s var(--spring)}
.bcard:active{transform:scale(.98)}
.bcard .img{height:120px;background:var(--sh) center/cover no-repeat}
.bcard .li{margin:0;padding:12px 14px;border-radius:0;animation:none}
.code{margin:8px 0 0;padding:14px;border-radius:18px;background:var(--sc);font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;white-space:pre;max-height:70vh;color:var(--on)}
.code .k{color:var(--primary)}.code .s{color:#3a9b5c}.code .c{color:var(--outline);font-style:italic}.code .u{background:color-mix(in srgb,#e8a100 22%,transparent);border-radius:4px}
.ftabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.ftabs .chip{font-size:13px;padding:6px 12px}
.compose{background:var(--sc);border-radius:24px;padding:16px 18px;margin:12px 0}
.compose .pick{display:flex;gap:6px;justify-content:center;margin:4px 0 10px}
.compose .pick button{border:0;background:none;padding:4px;cursor:pointer;color:var(--outline);transition:transform .35s var(--spring),color .2s}
.compose .pick button .ico{width:34px;height:34px}
.compose .pick button.on{color:#e8a100}
.compose .pick button:active{transform:scale(.85)}
.compose textarea{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:15px;color:var(--on);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:10px 12px;outline:0}
.compose textarea:focus{border-color:var(--primary)}
.compose .row{display:flex;gap:10px;margin-top:10px}.compose .row .btn{flex:1;height:44px}
.drop{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--sc);border:2px dashed color-mix(in srgb,var(--outline) 60%,transparent);cursor:pointer;transition:border-color .2s,background .2s;margin:10px 0}
.drop:hover,.drop.over{border-color:var(--primary)}
.drop.done{border-style:solid;border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
.drop .ico{width:26px;height:26px;color:var(--primary)}
.drop b{display:block;font-weight:500;color:var(--on)}.drop small{color:var(--var);font-size:12px}
.drop input{display:none}
.prev{display:flex;gap:12px;align-items:center;margin:6px 0}
.prev img.i{width:64px;height:64px;border-radius:22%;object-fit:cover}
.prev .b{flex:1;height:64px;border-radius:16px;background:var(--sh) center/cover no-repeat}
.sw{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer}
.sw div{flex:1}.sw b{display:block;font-weight:500}.sw small{color:var(--var);font-size:13px;line-height:1.4}
.tg{width:52px;height:32px;border-radius:16px;background:var(--sh);position:relative;flex:none;transition:background .25s;border:2px solid var(--outline)}
.tg:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--outline);top:6px;left:6px;transition:transform .35s var(--spring),width .2s,height .2s,top .2s,background .2s}
.sw.on .tg{background:var(--primary);border-color:var(--primary)}
.sw.on .tg:after{transform:translateX(20px);width:24px;height:24px;top:2px;background:var(--on-primary)}
.info{background:var(--sc);border-radius:20px;padding:14px 16px;font-size:14px;line-height:1.5;color:var(--var);margin:10px 0}
.info b{color:var(--on)}
.gbtn{display:flex;justify-content:center;margin:14px 0}
/* our own Google button; Google's real one lies invisibly on top and takes the tap */
.gsign{position:relative;display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 24px 0 16px;border-radius:24px;background:color-mix(in srgb,var(--primary) 16%,var(--sc));color:var(--on);font-weight:600;font-size:15px;overflow:hidden;transition:transform .3s var(--spring),background .2s;cursor:pointer;box-shadow:0 2px 6px -2px rgba(0,0,0,.3)}
.gsign:hover{background:color-mix(in srgb,var(--primary) 24%,var(--sc))}
.gsign:active{transform:scale(.95)}
.gsign .g{width:22px;height:22px;flex:none;background:#fff;border-radius:50%;padding:3px;box-sizing:content-box}
.gsign .real{position:absolute;inset:0;opacity:.001;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gsign .real>div{transform:scale(1.4)}
/* the profile */
.pf{text-align:center;padding:8px 0 24px}
.pfa{display:block;position:relative;width:112px;height:112px;margin:8px auto 14px;border-radius:50%;cursor:pointer;transition:transform .35s var(--spring)}
.pfa:active{transform:scale(.94)}
.pfa .face{width:100%;height:100%;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:44px;font-weight:700;overflow:hidden}
.pfa .face img{width:100%;height:100%;object-fit:cover}
.pfa .cam{position:absolute;right:2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.pfa .cam .ico{width:18px;height:18px}
.pf h1{margin:0;font-size:24px}.pf .at{color:var(--primary);font-size:15px;margin-top:2px}
.fm .hint{font-size:12px;min-height:16px;margin-top:-6px;transition:color .2s}
.fm .hint.ok{color:#3a9b5c}.fm .hint.bad{color:var(--err)}
.fm .at-in{position:relative}.fm .at-in input{padding-left:30px}.fm .at-in:before{content:"@";position:absolute;left:14px;top:13px;color:var(--var);font-size:16px}
.welcome{animation:pop .6s var(--spring)}
.rva img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.rvc{--rvbg:var(--sc)}
.rvs .rvc{animation:rvin .5s var(--emph) both;animation-delay:calc(var(--i,0)*45ms)}
.sum .hb i{animation:grow 800ms var(--emph) both}
.rvc .who small{color:var(--var);font-size:12px;font-weight:400}
.search .me{transition:opacity .2s,transform .4s var(--spring)}
.search.open .me{opacity:0;transform:scale(.4);pointer-events:none}

.sres .li{animation:none}
.sres .grp{color:var(--var);font-size:13px;font-weight:600;padding:14px 0 4px;list-style:none}
.pubc{background:var(--sc);border-radius:28px;padding:24px;display:grid;justify-items:center;gap:14px;animation:pop .45s var(--spring)}
.pubc span{color:var(--on);font-size:14px}
.btn.pc{font-variant-numeric:tabular-nums}
.icw canvas{pointer-events:none}
.acct{display:flex;gap:14px;align-items:center;background:var(--sc);border-radius:24px;padding:16px;margin:12px 0}
.acct img,.acct .me{width:48px;height:48px}
.acct div{flex:1;min-width:0}.acct small{color:var(--var)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="search" id="sbar"><button class="lead" id="sblead" aria-label="Поиск"><svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><svg class="back" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Поиск плагинов" aria-label="Поиск плагинов"><button class="x" id="qx" hidden aria-label="Очистить">✕</button><button class="me" id="me" aria-label="Аккаунт"></button></div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="secs"></div>
</div>
<nav class="bar" aria-label="Разделы" id="nav"></nav>
<div class="sview" id="sview"><ul class="sres" id="sres"></ul></div>
<div class="sheet" id="sheet"><div id="det"></div></div>
<div class="sheet" id="prof"><div id="pfd"></div></div>
<div class="pubov" id="pubov" hidden role="status"><div class="pubc"><canvas class="wring" aria-hidden="true"></canvas><span id="pubt"></span></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim"><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dt"><div class="di" id="di"></div><h3 id="dt"></h3><p id="dp"></p><div class="dacts"><button class="tb" id="dno">Отмена</button><button class="tb" id="dyes">ОК</button></div></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ID=/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/;

/* ---------------------------------------------------------------- icons: outlined, 24×24, as in the rest of the page */
const P={zoom_in:'<path d="M9.5 3a6.5 6.5 0 0 1 5.2 10.4l5.1 5.1-1.4 1.4-5.1-5.1A6.5 6.5 0 1 1 9.5 3Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9ZM9 7h1v2h2v1h-2v2H9v-2H7V9h2V7Z"/>',
 interface:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 9v11"/>',
 effects:'<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
 mod:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 text:'<path d="M5 7V5h14v2M12 5v14M9 19h6"/>',
 feed:'<rect x="4" y="3" width="16" height="8" rx="2"/><rect x="4" y="13" width="16" height="8" rx="2"/>',
 colours:'<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.2-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/>',
 events:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
 bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
 clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h4"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4.5-6 8-6s7 2 8 6"/>',
 code:'<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 out:'<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4"/>',
 camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
 contacts:'<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17c1-2 2.5-3 4-3s3 1 4 3"/>',
 vibrate:'<rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8M20 8v8"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 play:'<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 star:'<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
 upload:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 warn:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h0"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
 file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',
 zip:'<path d="M6 3h8l5 5v13H6z"/><path d="M11 6h1M11 9h1M11 12h1M10.5 15h2v3h-2z"/>',
};
const ico=(n,cls="")=>`<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||P.shield}</svg>`;
const star=on=>`<svg class="ico f ${on?"on":"off"}" viewBox="0 0 24 24" aria-hidden="true">${P.star}</svg>`;
const stars=n=>`<span class="stars" aria-label="${n} из 5">${[1,2,3,4,5].map(i=>star(i<=Math.round(n))).join("")}</span>`;

// what each permission means, in the words the app uses under its key button; 4th: risky
const RIGHTS={interface:["interface","Интерфейс","Свои кнопки и окна поверх экранов TikTok"],effects:["effects","Эффекты","Размытие, motion blur и шейдеры поверх экранов"],mod:["mod","Интерфейс и настройки мода","Меняет экраны мода и добавляет свои настройки",1],
 text:["text","Тексты и ники","Меняет подписи и ники"],feed:["feed","Лента","Убирает или переставляет видео"],colours:["colours","Цвета","Перекрашивает приложение"],region:["globe","Регион","Меняет регион, который видит TikTok"],
 events:["events","События","События мода и других плагинов"],network:["globe","Интернет","Отправляет и получает данные",1],notifications:["bell","Уведомления","Показывает свои уведомления"],
 clipboard:["clipboard","Буфер обмена","Копирует и читает скопированное",1],storage:["folder","Файлы","Сохраняет файлы в «Загрузки»"],account:["person","Аккаунт","Видит id аккаунта",1],tiktok:["code","Внутренности TikTok","Вызывает скрытые методы TikTok",1],
 watch:["eye","Действия в TikTok","Какое видео открыто, комментарии, поиск, сообщения",1],automation:["code","Нажатия за вас","Нажимает, листает и печатает вместо вас",1],player:["play","Плеер","Пауза, скорость, сохранение видео"],
 "android.permission.CAMERA":["camera","Камера","Разрешение Android",1],"android.permission.RECORD_AUDIO":["mic","Микрофон","Разрешение Android",1],"android.permission.ACCESS_FINE_LOCATION":["pin","Точное местоположение","Разрешение Android",1],
 "android.permission.ACCESS_COARSE_LOCATION":["pin","Примерное местоположение","Разрешение Android",1],"android.permission.READ_CONTACTS":["contacts","Контакты","Разрешение Android",1],"android.permission.VIBRATE":["vibrate","Вибрация","Разрешение Android"],
 "android.permission.POST_NOTIFICATIONS":["bell","Уведомления Android","Разрешение Android"]};
const right=p=>RIGHTS[p]||["shield",String(p).replace("android.permission.","").toLowerCase().replace(/_/g," "),"Разрешение"];
const CHIPS=[["all","Все"],["top","Лучшие"],["effects","Эффекты"],["interface","Интерфейс"],["feed","Лента"],["text","Тексты"],["network","Интернет"]];
const VERDICT={safe:["ok","Gemini: безопасен"],suspicious:["","Gemini: подозрительный"],dangerous:["bad","Gemini: опасен"],unknown:["","Gemini: не проверил"]};

let store=[],queue=[],state="load",qstate="idle",chip="all",query="",tab="store",open=null,user=null,googleId="";

/* ---------------------------------------------------------------- data */
async function load(){
 state="load";render();
 try{const r=await fetch("/plugins/catalog.json",{signal:AbortSignal.timeout(10000)});if(!r.ok)throw 0;
  const j=await r.json();store=(Array.isArray(j.plugins)?j.plugins:[]).filter(p=>p&&ID.test(p.id||"")&&p.format==="ctt");state="ok"}
 catch(e){state="err"}
 render();route()}
async function loadQueue(){
 qstate="load";if(tab==="queue")render();
 try{const r=await fetch("/plugins/native/queue",{signal:AbortSignal.timeout(10000)});if(!r.ok)throw 0;queue=(await r.json()).queue||[];qstate="ok"}
 catch(e){qstate="err"}
 render();route()}

/* ---------------------------------------------------------------- pieces */
const hue=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return h%360};
const grad=p=>`background:linear-gradient(135deg,hsl(${hue(p.id)} 45% 38%),hsl(${(hue(p.id)+40)%360} 55% 22%))`;
const size=n=>!n?"":n>1048576?(n/1048576).toFixed(1).replace(".",",")+" МБ":Math.max(1,Math.round(n/1024))+" КБ";
const plural=(n,a,b,c)=>{const t=n%100,u=n%10;return t>10&&t<20?c:u===1?a:u>=2&&u<=4?b:c};
const icon=p=>`<div class="icw" data-ic="${esc(p.id)}"><canvas aria-hidden="true"></canvas><div class="ic pli" style="${grad(p)}"><span>${esc(String(p.name||p.id)[0]||"?").toUpperCase()}</span>${p.icon&&p.icon[0]==="/"?`<img src="${esc(p.icon)}" alt="" loading="lazy" onerror="this.remove()">`:""}</div></div>`;

const asPlugin=q=>({...q.plugin,sub:q.id,icon:q.icon,banner:q.banner,by:q.handle,size:q.size,pending:true,reviewsOpen:q.reviewsOpen,gemini:q.review,added:q.added});

function shown(){

function token(){return user&&user.until>Date.now()+30000?user.token:""}
const face=()=>me&&me.avatar?me.avatar:user&&user.picture?user.picture:"";
const shownName=()=>me&&me.display?me.display:user?user.name:"";
function drawMe(){const b=$("#me"),f=face();b.innerHTML=user?(f?`<img src="${esc(f)}" alt="">`:esc((shownName()||"?")[0].toUpperCase())):ico("person");b.title=user?shownName():"Войти"}
async function loadMe(){
 if(!token())return null;
 try{const r=await fetch("/plugins/web/me",{method:"POST",headers:{"x-google-token":token()}});if(r.status===401){signOut();return null}
  me=await r.json();
  // the site's own 30-day session takes the place of Google's one-hour token: the sign-in survives closing the page
  if(me.session){user={...user,token:me.session,until:me.sessionUntil};delete me.session;delete me.sessionUntil;keep()}
  try{localStorage.setItem("ttcuz-me",JSON.stringify(me))}catch{}drawMe();loadMine().then(()=>{if(open)reopen()});return me}catch{return null}}
function keep(){try{localStorage.setItem("ttcuz-google",JSON.stringify(user))}catch{}}
async function signedIn(credential){
 try{const part=JSON.parse(decodeURIComponent(escape(atob(credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))));
  const first=!user;
  user={token:credential,name:part.name||part.email||"",picture:part.picture||"",until:part.exp*1000};
  keep();
  drawMe();await loadMe();render();if(open)reopen();
  if(first)welcome()}catch(e){toast("Не удалось войти")}}
function welcome(){
 // the signed-in window: who you are now, and a username to pick on the first visit
 const f=face(),fresh=me&&me.fresh;
 ask(fresh?"Добро пожаловать!":"Вы вошли",fresh?"Придумайте имя пользователя: по нему вас узнают в отзывах и в магазине. Его можно поменять потом в профиле.":"Отзывы и плагины теперь отправляются от вашего профиля"+(me&&me.username?" @"+me.username:"")+".",fresh?"Выбрать имя":"Профиль",
  `<div class="welcome" style="width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:30px;font-weight:700">${f?`<img src="${esc(f)}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc((shownName()||"?")[0].toUpperCase())}</div>`)
  .then(y=>{if(y)profile()})}
function signOut(){user=null;me=null;try{for(const k of ["ttcuz-google","ttcuz-me"]){localStorage.removeItem(k);sessionStorage.removeItem(k)}}catch{}try{google.accounts.id.disableAutoSelect()}catch{}$("#prof").classList.remove("open");drawMe();render();if(open)reopen()}
async function setupGoogle(){
 try{const u=JSON.parse(localStorage.getItem("ttcuz-google")||sessionStorage.getItem("ttcuz-google")||"null");if(u&&u.until>Date.now()+60000){user=u;me=JSON.parse(localStorage.getItem("ttcuz-me")||sessionStorage.getItem("ttcuz-me")||"null")}}catch{}
 drawMe();
 // a kept session is checked (and renewed in its last week) once per visit
 if(user)loadMe().then(()=>render());
 // the client id rarely changes: kept for a day, so most visits ask nothing for it
 try{const c=JSON.parse(localStorage.getItem("ttcuz-gid")||"null");if(c&&c.until>Date.now())googleId=c.id}catch{}
 if(!googleId){try{googleId=(await (await fetch("/plugins/web/config")).json()).google||"";localStorage.setItem("ttcuz-gid",JSON.stringify({id:googleId,until:Date.now()+86400000}))}catch{}}
 if(!googleId){document.querySelectorAll("[data-gbtn]").forEach(gButton);return}
 const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;
 s.onload=()=>{google.accounts.id.initialize({client_id:googleId,callback:r=>signedIn(r.credential),auto_select:true,cancel_on_tap_outside:true,use_fedcm_for_prompt:true});if(!user)google.accounts.id.prompt();document.querySelectorAll("[data-gbtn]").forEach(gButton)};
 document.head.append(s)}
function gButton(el){
 if(!googleId){el.innerHTML=`<p class="pnote" style="text-align:center">Вход через Google скоро появится.</p>`;return}
 el.innerHTML=`<div class="gsign">${G}<span>Войти через Google</span><div class="real"></div></div>`;
 if(window.google&&google.accounts)google.accounts.id.renderButton(el.querySelector(".real"),{type:"standard",size:"large",shape:"pill",width:260,locale:"ru"})}

 $("#prof").classList.add("open");
 $("#pbk").onclick=()=>$("#prof").classList.remove("open");

 let avatar,timer;
 $("#pfile").onchange=async e=>{const file=e.target.files[0];if(!file)return;
  try{avatar=await picture(file,256,256,"image/jpeg",48000);$("#pface").innerHTML=`<img src="data:image/jpeg;base64,${avatar}" alt="">`;$("#pface").animate([{transform:"scale(.85)"},{transform:"scale(1)"}],{duration:420,easing:"cubic-bezier(.34,1.56,.64,1)"});toast("Нажмите «Сохранить»")}
  catch(err){toast(err.message||"Не подошла картинка")}};

 const hint=(t,c)=>{const h=$("#phint");h.textContent=t;h.className="hint "+(c||"")};
 $("#puser").oninput=e=>{

  timer=setTimeout(async()=>{try{const r=await (await fetch("/plugins/web/username/"+encodeURIComponent(v))).json();if($("#puser").value!==v)return;hint(r.free?"Свободно — @"+v:r.hint,r.free?"ok":"bad")}catch{hint("")}},550)};
 $("#psave").onclick=async e=>{

  if(!token()){toast("Войдите заново");signOut();return}
  b.disabled=true;b.textContent="Сохраняем…";busyShow("Сохраняем профиль…");
  try{const r=await fetch("/plugins/web/profile",{method:"POST",headers:{"content-type":"application/json","x-google-token":token()},body:JSON.stringify(body)});const j=await r.json();
   if(!r.ok)throw new Error(j.hint||j.error);me={...j,fresh:false};try{localStorage.setItem("ttcuz-me",JSON.stringify(me))}catch{}
   drawMe();$("#pname").textContent=me.display;$("#pat").textContent="@"+me.username;hint("Сохранено.","ok");toast("Профиль сохранён");avatar=undefined;if(open)reopen()}
  catch(err){hint(err.message||"Не удалось сохранить","bad")}
  finally{busyShow("");b.disabled=false;b.textContent="Сохранить"}}}

/* ---------------------------------------------------------------- M3 wavy indicators, as in CStore */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),mix=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
const dpr0=()=>Math.min(window.devicePixelRatio||1,3);
const calm=matchMedia("(prefers-reduced-motion:reduce)");
const ringColor=()=>getComputedStyle(document.documentElement).getPropertyValue("--primary").trim()||"#2f5fa3";
// indeterminate: an arc that grows and shrinks while it turns, a wave running along it
function ringIndet(cv,now){const S=cv.clientWidth,px=Math.round(S*dpr0());if(!S)return;if(cv.width!==px)cv.width=cv.height=px;
 const c=cv.getContext("2d"),col=getComputedStyle(cv).color,u=px/96;c.setTransform(u,0,0,u,48*u,48*u);c.clearRect(-48,-48,96,96);c.lineWidth=+cv.dataset.lw||5;c.lineCap=c.lineJoin="round";
 const RR=36,gap=8/RR,ph=(calm.matches?0:(now/1000)%1)*TAU,s0=-Math.PI/2+now/1500*TAU,len=mix(.12,.72,(1-Math.cos(now/2200*TAU))/2)*TAU,g=gap*clamp(len*RR/10);
 const arc=(a0,a1,am)=>{const n=Math.max(2,Math.ceil((a1-a0)*RR/2));c.beginPath();for(let i=0;i<=n;i++){const a=mix(a0,a1,i/n),r=RR+am*Math.sin(a*10-ph);i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r)}c.stroke()};
 c.strokeStyle=col;c.globalAlpha=.25;const rest=TAU-len-2*g;if(rest>.05)arc(s0+len+g,s0+len+g+rest,0);
 c.globalAlpha=1;if(len*RR>1)arc(s0,s0+len,2.2*clamp(len*RR/24))}
// determinate around an icon: a spiral that settles into the rim, then the wave runs while it fills
function drawLoader(c,st,now,col){
 const W=c.clientWidth;if(!W)return;const px=Math.round(W*dpr0());if(c.width!==px)c.width=c.height=px;
 const x=c.getContext("2d");x.setTransform(px/W,0,0,px/W,0,0);x.clearRect(0,0,W,W);
 const el=(now-st.t0)/1000,e=clamp(el/1.4),sm=e*e*(3-2*e);
 const rot=TAU/1.7*(e<1?1.4*(e**3-e**4/2):.7+el-1.4),ph=el*TAU*.9;
 const p=clamp(st.d/100),fl=st.f?clamp((now-st.f)/550):0,flat=1-clamp((p-.86)/.14),flatEase=flat*flat*(3-2*flat),len=TAU*(.1+.9*p),R=W*.42,g=W*.05/R*clamp(len*R/(W*.3)),s0=-Math.PI/2+rot;
 x.lineWidth=W*.05;x.lineCap=x.lineJoin="round";
 const ring=(a0,a1,am,sp)=>{const n=Math.max(2,Math.ceil((a1-a0)*R/2));x.beginPath();
  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,r=R+am*Math.sin(a*10-ph)-sp*W*.09*(1-i/n),X=W/2+Math.cos(a)*r,Y=W/2+Math.sin(a)*r;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke()};
 const rest=TAU-len-2*g;x.strokeStyle=col;
 if(rest>.05){x.globalAlpha=.25*sm;ring(s0+len+g,s0+len+g+rest,0,0)}
 x.globalAlpha=1;ring(s0,s0+len,W*.024*sm*flatEase*(1-fl)*clamp(len*R/(W*.3)),1-sm)}
// determinate, linear: a wavy line that flattens as it nears the end
function drawLinear(c,st,now,col){
 const W=c.clientWidth,H=c.clientHeight;if(!W)return;const k=dpr0(),pw=Math.round(W*k),ph=Math.round(H*k);if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}
 const x=c.getContext("2d");x.setTransform(k,0,0,k,0,0);x.clearRect(0,0,W,H);
 const p=clamp(st.d/100),lw=4,pad=lw/2+1,len=W-2*pad,end=pad+len*p,gap=6,amp=3.2*(1-clamp((p-.9)/.1)),ph0=(now-st.t0)/1000*TAU*.9,wl=26,my=H/2;
 x.lineWidth=lw;x.lineCap="round";x.lineJoin="round";x.strokeStyle=col;
 if(end+gap<W-pad){x.globalAlpha=.25;x.beginPath();x.moveTo(end+gap,my);x.lineTo(W-pad,my);x.stroke()}
 x.globalAlpha=1;x.beginPath();const n=Math.max(2,Math.ceil((end-pad)/2));
 for(let i=0;i<=n;i++){const X=pad+(end-pad)*i/n,ramp=clamp((X-pad)/16),Y=my+amp*ramp*Math.sin((X/wl)*TAU-ph0);i?x.lineTo(X,Y):x.moveTo(X,Y)}
 x.stroke()}
// one frame loop for all of them; it stops by itself when nothing is spinning or downloading
const dl={};let raf=0,last=0;
function tick(now){
 raf=0;const k=Math.min(3,(now-last)/16.7||1);last=now;let busy=false;
 if(!document.hidden)document.querySelectorAll(".wring").forEach(c=>{if(c.clientWidth){ringIndet(c,now);busy=true}});
 const col=ringColor();
 for(const id of Object.keys(dl)){
  const st=dl[id];busy=true;
  st.d+=(st.t-st.d)*(1-Math.pow(.94,k));
  const pc=Math.round(st.d)+"%";
  if(st.lp!==pc){st.lp=pc;document.querySelectorAll(`[data-pc="${CSS.escape(id)}"]`).forEach(el=>el.textContent=pc)}
  document.querySelectorAll(`[data-ic="${CSS.escape(id)}"] canvas`).forEach(c=>drawLoader(c,st,now,col));
  document.querySelectorAll(`[data-lc="${CSS.escape(id)}"]`).forEach(c=>drawLinear(c,st,now,col));
  const lt=st.total?size(st.total*st.d/100)+" из "+size(st.total):pc;
  document.querySelectorAll(`[data-lt="${CSS.escape(id)}"]`).forEach(el=>{if(el.textContent!==lt)el.textContent=lt});
  if(st.done&&st.d>99.5){st.d=100;if(!st.f)st.f=now;if(now-st.f>650)finish(id)}}
 if(busy)raf=requestAnimationFrame(tick)}
const kick=()=>{if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}};

/* ---------------------------------------------------------------- download */
async function download(id){
 const p=store.find(x=>x.id===id);if(!p||dl[id])return;
 const st=dl[id]={t:0,d:0,t0:performance.now(),total:p.size||0,ac:new AbortController()};
 document.querySelectorAll(`[data-ic="${CSS.escape(id)}"]`).forEach(el=>el.classList.add("dl"));
 document.querySelectorAll(`[data-dlb="${CSS.escape(id)}"]`).forEach(b=>morph(b,`<span data-pc="${esc(id)}">0%</span>`,true,true));
 document.querySelectorAll(`[data-lb="${CSS.escape(id)}"]`).forEach(b=>b.classList.add("on"));
 kick();
 try{const r=await fetch(p.url,{signal:st.ac.signal});if(!r.ok)throw new Error("http "+r.status);
  const total=+r.headers.get("content-length")||p.size||0,rd=r.body.getReader(),parts=[];let got=0;st.total=total;
  for(;;){const x=await rd.read();if(x.done)break;parts.push(x.value);got+=x.value.length;if(total)st.t=Math.min(99,got/total*100)}
  const blob=new Blob(parts);
  if(p.sha256&&crypto.subtle){const h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",await blob.arrayBuffer()))].map(n=>n.toString(16).padStart(2,"0")).join("");if(h!==p.sha256)throw new Error("контрольная сумма не совпала")}
  st.blob=blob;st.t=100;st.done=true}
 catch(e){const was=dl[id];cancelDl(id);if(was&&e.name!=="AbortError")toast("Не удалось скачать: "+(e.message||"ошибка сети"))}}
function finish(id){
 const st=dl[id];if(!st)return;delete dl[id];
 const p=store.find(x=>x.id===id);
 const u=URL.createObjectURL(st.blob),a=document.createElement("a");a.href=u;a.download=id+".ctt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
 reset(id,"Скачано");toast(((p&&p.name)||id)+" скачан");
 setTimeout(()=>document.querySelectorAll(`[data-dlb="${CSS.escape(id)}"]`).forEach(b=>morph(b,"Скачать .ctt",false,true)),2600)}
function cancelDl(id){const st=dl[id];if(!st)return;try{st.ac.abort()}catch{}delete dl[id];reset(id,"Скачать .ctt")}
function reset(id,label){
 document.querySelectorAll(`[data-ic="${CSS.escape(id)}"]`).forEach(el=>{el.classList.remove("dl");const c=el.querySelector("canvas");if(c)c.getContext("2d").clearRect(0,0,c.width,c.height)});
 document.querySelectorAll(`[data-dlb="${CSS.escape(id)}"]`).forEach(b=>morph(b,label,false,true));
 document.querySelectorAll(`[data-lb="${CSS.escape(id)}"]`).forEach(b=>b.classList.remove("on"))}

const sbar=$("#sbar"),sview=$("#sview"),sres=$("#sres");sview.inert=true;
const N=t=>String(t||"").toLowerCase().replace(/ё/g,"е");
function sOpen(o){sbar.classList.toggle("open",o);sbar.parentElement.classList.toggle("sopen",o);sview.classList.toggle("open",o);sview.inert=!o;$("#sblead").setAttribute("aria-label",o?"Назад":"Поиск");
 if(o)sFill();else{$("#q").blur();setTimeout(()=>{if(!sbar.classList.contains("open")){$("#q").value="";$("#qx").hidden=true}},260)}}
function sFill(){
 // the store first, then what waits for review; the best match on top
 const v=N($("#q").value.trim()),W=v.split(/\s+/).filter(Boolean);$("#qx").hidden=!v;
 const score=p=>{const n=N(p.name||p.id),rest=N([p.id,p.author,p.about,p.by].join(" "));if(!W.every(w=>(n+" "+rest).includes(w)))return 9;return !v||n.startsWith(v)?0:n.includes(v)?1:2};
 const pick=l=>l.map(p=>[score(p),p]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||((b[1].rating?.count||0)-(a[1].rating?.count||0))).map(x=>x[1]);
 const a=pick(store),b=pick(queue.map(asPlugin));let i=0;
 sres.innerHTML=(a.length?a.map(p=>`<li style="--i:${Math.min(i++,8)}">${row(p,0)}</li>`).join(""):"")
  +(b.length?`<li class="grp" style="--i:${Math.min(i++,8)}">На проверке</li>`+b.map(p=>`<li style="--i:${Math.min(i++,8)}">${row(p,0,true)}</li>`).join(""):"")
  +(!a.length&&!b.length?`<li style="--i:0"><p class="empty">${v?"Ничего не нашлось":"Начните вводить название"}</p></li>`:"");
 if(qstate==="idle")loadQueue()}
$("#q").addEventListener("focus",()=>{if(!sbar.classList.contains("open"))sOpen(true)});
["input","search","compositionend"].forEach(t=>$("#q").addEventListener(t,sFill));
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#q").blur()}});
sbar.addEventListener("click",e=>{if(e.target.closest("#me"))return;if(!sbar.classList.contains("open"))$("#q").focus();else if(e.target.closest("#sblead"))sOpen(false)});
$("#qx").onclick=e=>{e.stopPropagation();$("#q").value="";sFill();$("#q").focus()};

 if(dl[p.id])document.querySelectorAll(`#det [data-ic="${CSS.escape(p.id)}"]`).forEach(el=>el.classList.add("dl"));
 const tb=$("#dtabs"),ind=tb.querySelector(".ind"),pan=[...document.querySelectorAll("#det .tp")];
 const setInd=()=>{const sp=tb.querySelector('[aria-selected="true"] span');if(!sp)return;const t=tb.getBoundingClientRect(),b=sp.getBoundingClientRect();ind.style.width=b.width+"px";ind.style.transform=`translateX(${b.left-t.left-16}px)`};

async function sources(p,key){

 try{const r=await fetch("/plugins/native/public/"+p.sub+"/sources");if(!r.ok)throw 0;const files=(await r.json()).files||[];if(open!==key)return;

async function reviews(p,key){
 const box=$("#rvp");
 try{const r=await fetch("/plugins/reviews/"+encodeURIComponent(p.id),{headers:token()?{"x-google-token":token()}:{},signal:AbortSignal.timeout(10000)});if(!r.ok)throw 0;const j=await r.json();
  if(open!==key)return;

  box.innerHTML=(j.count?`<div class="sum"><div><div class="big">${String(j.average).replace(".",",")}</div>${stars(j.average)}<br><small style="color:var(--var)">${j.count} ${plural(j.count,"отзыв","отзыва","отзывов")}</small></div><div class="hist">${[5,4,3,2,1].map(n=>`<div class="hrow">${n}<div class="hb"><i style="width:${j.histogram[n-1]/max*100}%"></i></div></div>`).join("")}</div></div>`:`<div class="empty" style="padding:28px 16px">Отзывов пока нет — будьте первым.</div>`)
   +composer(j.mine)
   +`<div class="rvs">${j.reviews.map((x,i)=>reviewCard(x,i)).join("")}</div>`;
  box._reviews=j.reviews;wireThreads(box,p);
  wireComposer(p,key,j.mine)}
 catch(e){if(open===key)box.innerHTML=`<div class="empty">Не удалось загрузить отзывы.</div>`}}
/* ---------------------------------------------------------------- likes, dislikes and replies, as on CStore */
const TH='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9H4v-9zM7 11l4-8c1.6 0 2.5 1.1 2.2 2.6L12.8 9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg>';
const RPI='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 9V5l-7 7 7 7v-4c5 0 8.5 1.5 11 5-1-6-4-10-11-11z"/></svg>';
const who=x=>`<b>${x.name?esc(x.name):x.handle?"@"+esc(x.handle):"Пользователь ttcuz"}</b>${x.name&&x.handle?` <small>@${esc(x.handle)}</small>`:""}`;
const face0=x=>x.avatar?`<img src="${esc(x.avatar)}" alt="" loading="lazy">`:esc(((x.name||x.handle)||"?")[0].toUpperCase());

const pop=b=>b.animate([{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}],{duration:360,easing:"cubic-bezier(.34,1.56,.64,1)"});
function wireThreads(box,p){
 const base="/plugins/reviews/"+encodeURIComponent(p.id);
 const post=async(path,body)=>{if(!token())throw new Error("Войдите через Google");const r=await fetch(base+path,{method:"POST",headers:{"content-type":"application/json","x-google-token":token()},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.hint||j.error||"HTTP "+r.status);return j};
 const need=()=>{if(!user){account();return true}if(me&&!me.username){profile();toast("Сначала выберите имя пользователя");return true}return false};
 // a vote shows at once; if the server says no, it goes back
 const setV=(o,nv)=>{if(o.my===1)o.up--;if(o.my===-1)o.dn--;o.my=nv;if(nv===1)o.up++;if(nv===-1)o.dn++};
 const paint=(el,o,sel,key)=>el.querySelectorAll(sel).forEach(b=>{const u=b.dataset[key]==="1",on=o.my===(u?1:-1);b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on));b.querySelector("span").textContent=String(u?o.up:o.dn)});
 const syncMore=(el,x)=>{const rps=el.querySelector(".rps");let b=el.querySelector(".rmore");const k=x.replies.length-1;
  if(k<1){if(b)b.remove();rps.classList.remove("open");return}
  if(!b){rps.insertAdjacentHTML("afterend",'<button type="button" class="rmore" data-rm></button>');b=el.querySelector(".rmore")}
  const o=rps.classList.contains("open");b.setAttribute("aria-expanded",String(o));b.textContent=o?"Скрыть ответы":`Показать ещё ${k} ${rpPl(k)}`};
 const count=(el,x)=>{el.querySelector(".rb span").textContent="Ответить"+(x.replies.length?" · "+x.replies.length:"")};
 box.onclick=async e=>{
  const card=e.target.closest(".rvc[data-i]");if(!card)return;const x=box._reviews[+card.dataset.i];if(!x)return;
  const vb=e.target.closest(".vb[data-v]");
  if(vb){if(need())return;if(x.mine){toast("Свой отзыв оценить нельзя");return}if(card._busy)return;
   const prev=x.my,want=+vb.dataset.v,nv=prev===want?0:want;card._busy=1;setV(x,nv);paint(card,x,".vb[data-v]","v");pop(vb);
   try{await post("/vote",{ref:x.ref,value:nv})}catch(err){setV(x,prev);paint(card,x,".vb[data-v]","v");toast(err.message)}finally{card._busy=0}return}
  const rv=e.target.closest(".rv[data-rv]");
  if(rv){if(need())return;const el=rv.closest(".rp"),o=x.replies.find(r=>String(r.id)===el.dataset.rid);if(!o||el._busy)return;if(o.mine){toast("Свой ответ оценить нельзя");return}
   const prev=o.my,want=+rv.dataset.rv,nv=prev===want?0:want;el._busy=1;setV(o,nv);paint(el,o,".rv","rv");pop(rv);
   try{await post("/replies/"+o.id+"/vote",{value:nv})}catch(err){setV(o,prev);paint(el,o,".rv","rv");toast(err.message)}finally{el._busy=0}return}
  if(e.target.closest("[data-rm]")){const rps=card.querySelector(".rps");rps.classList.toggle("open");syncMore(card,x);return}
  if(e.target.closest("[data-rd]")){const el=e.target.closest(".rp"),o=x.replies.find(r=>String(r.id)===el.dataset.rid);if(!o)return;
   if(!await ask("Удалить ответ?","Он пропадёт под отзывом у всех.","Удалить"))return;
   try{await post("/replies/"+o.id+"/delete");x.replies=x.replies.filter(r=>r!==o);el.style.transition="opacity .25s,transform .25s";el.style.opacity=0;el.style.transform="translateX(20px)";setTimeout(()=>{el.remove();count(card,x);syncMore(card,x)},250);toast("Ответ удалён")}catch(err){toast(err.message)}return}
  if(e.target.closest("[data-rp]")){if(need())return;
   const old=card.querySelector(".rpf");if(old){old.remove();return}

  // one file per class path: a ZIP may hold the same file twice (a copy, a backup folder), Windows writes "\"
  const add=(n,t)=>{n=n.replace(/\\/g,"/");if(/(^|\/)(build|out|bin|\.git|__MACOSX)\//.test(n))return;const i=n.lastIndexOf("/java/")>=0?n.lastIndexOf("/java/")+1:n.startsWith("java/")?0:-1;
   let path=i>=0?n.slice(i):javaPath(n,t);if(!/^java\/(?:[A-Za-z_$][\w$]*\/)*[A-Za-z_$][\w$]*\.java$/.test(path))path=javaPath(n,t);found.set(path,{path,text:t.replace(/^\uFEFF/,"")})};
  for(const f of fl){
   if(/\.zip$/i.test(f.name)){const z=await unzip(await f.arrayBuffer());for(const [n,d] of z){if(!/\.java$/.test(n))continue;add(n,new TextDecoder().decode(d))}}
   else if(/\.java$/i.test(f.name))add(f.name,await f.text())}
  const files=[...found.values()];
  if(!files.length)throw new Error("Не нашлось ни одного файла .java");if(files.length>32)throw new Error("Не больше 32 файлов .java");form.files=files});
 pick("#ficon",async fl=>{form.icon=await animatedIcon(fl[0])||await picture(fl[0],128,128,"image/png",32768)});
 pick("#fban",async fl=>{const b=await bannerCrop(fl[0]);if(b)form.banner=b});
 $("#fchg").oninput=e=>form.changes=e.target.value;
 $("#fopen").onclick=e=>{form.open=!form.open;e.currentTarget.classList.toggle("on",form.open);e.currentTarget.setAttribute("aria-checked",form.open)};
 $("#fsend").onclick=async e=>{
  const b=e.currentTarget;
  if(!form.ctt){toast("Добавьте пакет .ctt");return}if(!form.files.length){toast("Добавьте исходники .java");return}
  if(!token()){toast("Войдите заново");signOut();return}
  b.disabled=true;b.textContent="Отправляем…";busyShow("Отправляем плагин на проверку…");
  try{const r=await fetch("/plugins/web/submit",{method:"POST",headers:{"content-type":"application/json","x-google-token":token()},body:JSON.stringify({archive:b64(form.ctt),files:form.files,icon:form.icon||undefined,banner:form.banner||undefined,reviewsOpen:form.open,changes:form.changes||undefined})});
   const j=await r.json().catch(()=>({}));
   // the reasons stay on screen until read: a toast vanished before anyone could see what was wrong
   if(!r.ok&&Array.isArray(j.reasons)&&j.reasons.length){await ask(j.error==="obfuscated"?"Код не принят":"Пакет не совпадает с исходниками","• "+j.reasons.join("\n• ")+"\n\nСоберите .ctt заново из этих же файлов и приложите все .java, из которых он собран.","Понятно",ico("close"));return}
   if(!r.ok)throw new Error(j.hint||j.error||("HTTP "+r.status));
   Object.assign(form,{ctt:null,manifest:null,files:[],icon:"",banner:"",open:false,changes:""});
   await ask(j.update?"Обновление отправлено":"Плагин отправлен",(j.update?"Версия v"+j.update.from+" → новая. ":"")+"Его прочитает Gemini, потом модератор. Пока он во вкладке «На проверке».","Понятно",ico("check"));
   tab="queue";qstate="idle";render()}
  catch(err){toast(err.message||"Не удалось отправить")}
  finally{busyShow("");b.disabled=false;b.textContent="Отправить на проверку"}}}

/* ---------------------------------------------------------------- glue */
function toast(t,act,cb){const e=$("#toast");e.innerHTML="";const sp=document.createElement("span");sp.textContent=t;e.append(sp);
 if(act){const b=document.createElement("button");b.textContent=act;b.onclick=()=>{e.classList.remove("show");clearTimeout(toast.t);cb&&cb()};e.append(b)}
 e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),act?5000:1900)}
let dlgRes=null;
function dlgClose(v){$("#scrim").classList.remove("open");const r=dlgRes;dlgRes=null;r&&r(v)}
function ask(title,text,ok,ic){return new Promise(res=>{if(dlgRes)dlgClose(false);dlgRes=res;
 // whatever an earlier window added (the sign-in button) goes with it
 document.querySelectorAll("#scrim .gbtn").forEach(x=>x.remove());$("#dno").style.display="";$("#di").innerHTML=ic||"";$("#dt").textContent=title;$("#dp").textContent=text;$("#dp").style.whiteSpace="pre-line";$("#dyes").textContent=ok||"ОК";$("#scrim").classList.add("open");setTimeout(()=>$("#dyes").focus(),50)})}
$("#dyes").onclick=()=>dlgClose(true);$("#dno").onclick=()=>dlgClose(false);
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")dlgClose(false)});
function route(){
 const h=decodeURIComponent(location.hash.slice(1));let key=null;
 if(h.startsWith("plugin-"))key=h.slice(7);else if(h.startsWith("review-")){key="q:"+h.slice(7);if(qstate==="idle"){loadQueue();return}}
 if(key&&find(key))detail(key,false);else if(open&&!key)close()}
window.addEventListener("popstate",route);
document.addEventListener("click",e=>{
 const go=e.target.closest("[data-go]");if(go){e.stopPropagation();openInApp(go.dataset.go);return}
 const x=e.target.closest("[data-x]");if(x){cancelDl(x.dataset.x);return}
 const c=e.target.closest("[data-id]");if(c&&!e.target.closest("#sheet")){if(c.closest("#sres"))sOpen(false);detail(c.dataset.id);return}
 const ch=e.target.closest("[data-c]");if(ch){chip=ch.dataset.c;render();window.scrollTo({top:0,behavior:"smooth"});return}
 const n=e.target.closest("[data-t]");if(n){tab=n.dataset.t;render();window.scrollTo({top:0});return}
 const pf=e.target.closest("[data-profile]");if(pf){profile();return}
 const rt=e.target.closest("[data-retry]");if(rt){rt.dataset.retry==="q"?loadQueue():load()}});
$("#me").onclick=account;

document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("#scrim").classList.contains("open")){dlgClose(false);return}if($("#prof").classList.contains("open"))$("#prof").classList.remove("open");else if(open)close();else if(sbar.classList.contains("open"))sOpen(false)});
setupGoogle().then(()=>{if(user&&!me)loadMe().then(()=>render())});load();
</script>
