name = "ttcuz"
main = "worker.mjs"
compatibility_date = "2026-09-30"
workers_dev = true

# plugins waiting for review that never reached Discord are sent again (worker.mjs scheduled)
[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "PROFILES"
database_name = "ttcuz-profiles"
database_id = "418e22cb-764e-48f1-afea-1e75d5a36225"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/health", "/badges", "/badges/*", "/version", "/v1/*", "/plugins/*"]

# Per-address limits checked before any route (shield.mjs): Cloudflare's own counters, no database writes.
[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[vars]
# the mod's Discord server ("Просмотр плагинов"); its channels are found by name (see discord.mjs)
DISCORD_GUILD_ID = "1565603024804642858"
# Google sign-in on the store page (store.html): the Web client id from Google Cloud Console, with
# https://ttcuz.ttcuz1337.workers.dev as an authorized JavaScript origin. Empty: the page offers no sign-in.
GOOGLE_CLIENT_ID = "216075865766-8ujp7dnvm358u3mdlqbft8sjknqkukls.apps.googleusercontent.com"
