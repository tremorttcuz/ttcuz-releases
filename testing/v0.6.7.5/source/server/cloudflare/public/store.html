<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Магазин плагинов</title>
<style>:root{color-scheme:light dark;--bg:#fff;--c:#f3f4f6;--t:#111;--m:#666;--a:#fe2c55}@media(prefers-color-scheme:dark){:root{--bg:#111215;--c:#1c1d22;--t:#efeff1;--m:#9a9da6}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}main{max-width:640px;margin:auto;padding:20px}
h1{font-size:26px;margin:8px 0}p.s{color:var(--m);margin:0 0 16px}input{width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--c);color:var(--t);font:inherit;margin-bottom:14px}
.card{display:flex;gap:14px;background:var(--c);border-radius:16px;padding:14px;margin-bottom:10px;align-items:center}.card img,.ph{width:56px;height:56px;border-radius:12px;flex:none;background:#8884}
.card div{flex:1;min-width:0}.card b{display:block}.card small{color:var(--m)}a.b{background:var(--a);color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:600;flex:none}
.w{display:block;margin-top:4px;font-size:12px}.e{text-align:center;color:var(--m);padding:40px 0}footer{text-align:center;color:var(--m);font-size:13px;padding:20px}footer a{color:var(--m)}details{background:var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px}summary{cursor:pointer;font-weight:600}ol{margin:8px 0 0;padding-left:20px;color:var(--m)}</style>
<main><h1>Плагины</h1><p class="s">Каждый плагин проверен до публикации.</p><details><summary>Как установить плагин</summary><ol><li>Нажмите «Скачать» у нужного плагина.</li><li>Откройте ttcuz → Настройки → Плагины и выберите скачанный файл .ctt.</li><li>Перезапустите TikTok.</li></ol></details><input id="q" placeholder="Поиск" type="search"><div id="l"><div class="e">Загрузка…</div></div></main>
<footer>Вы разработчик? <a href="dev.html">Как опубликовать плагин</a></footer>
<script>
const l=document.getElementById('l'),q=document.getElementById('q');let all=[];
const mb=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.max(1,Math.round(n/1024))+' КБ';
function show(){const t=q.value.toLowerCase(),r=all.filter(p=>(p.name+p.about+p.author).toLowerCase().includes(t));l.textContent='';
if(!r.length){l.innerHTML='<div class="e">'+(all.length?'Ничего не найдено':'Пока нет плагинов')+'</div>';return}
for(const p of r){const c=document.createElement('div');c.className='card';
const i=p.icon?Object.assign(document.createElement('img'),{src:p.icon,alt:''}):Object.assign(document.createElement('div'),{className:'ph'});
const d=document.createElement('div'),n=document.createElement('b'),s=document.createElement('small'),a=document.createElement('a');
n.textContent=p.name;s.textContent=(p.about||'')+' · '+p.author+' · v'+p.version+(p.size?' · '+mb(p.size):'');
a.className='b';a.textContent='Скачать';a.href=p.url;a.setAttribute('download','');const w=document.createElement('small');w.className='w';w.textContent=(p.can&&p.can.length?'Умеет: '+p.can.join(', '):'')+(p.verdict==='review'?' · ⚠ требует внимания':'');d.append(n,s,w);c.append(i,d,a);l.append(c)}}
q.oninput=show;
(async()=>{for(const u of['/plugins','/plugins/catalog.json'])try{const r=await fetch(u);if(r.ok){all=(await r.json()).plugins||[];if(all.length||u!=='/plugins')break}}catch{}show()})();
</script></html>
